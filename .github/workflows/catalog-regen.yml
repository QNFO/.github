name: Regenerate Publication Catalog

on:
  push:
    paths:
      - 'releases/papers/**.md'
    branches:
      - master
  workflow_dispatch:

# GHA-AUDIT-DOTGITHUB-1 (2026-10-19, QNFO/qnfo-workers agent_issues 2507): a read-only default token; the concurrency group is shared with build-pdfs.yml
# (both commit to master on the same push), and the commit-back rebases onto the new tip before it pushes.
permissions:
  contents: read

# WORKFLOW-CONCURRENCY-1 (2026-10-17): a second run of the same workflow on the same
# branch queues behind the first instead of racing it. Publishing pipelines must never be
# cancelled mid-flight (a half-published DOI is worse than a late one), so this queues.
concurrency:
  group: legacy-papers-${{ github.ref }}
  cancel-in-progress: false

jobs:
  catalog:
    runs-on: ubuntu-latest
    # WORKFLOW-TIMEOUT-1 (2026-10-17): bound a hung runner.
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Generate catalog index.md
        run: |
          import os, re

          papers_dir = 'releases/papers'
          papers = sorted([f for f in os.listdir(papers_dir) if f.endswith('.md') and f != 'index.md'])

          lines = []
          lines.append('# QNFO Legacy Publications Catalog')
          lines.append('')
          lines.append(f'**{len(papers)} papers** — migrated from Obsidian releases | [QNFO Org](https://github.com/QNFO) | [QWAV Hub](https://qnfo.github.io/QWAV/)')
          lines.append('')
          lines.append('These papers were originally published via Obsidian Publish and migrated to GitHub as a permanent archive.')
          lines.append('**New publications** are stored in their native project repositories.')
          lines.append('')
          lines.append('| Title | Words | GitHub |')
          lines.append('|:------|:-----|:-------|')

          for fname in papers:
              fpath = os.path.join(papers_dir, fname)
              with open(fpath, 'r', encoding='utf-8') as f:
                  content = f.read()
              words = len(re.findall(r'\b\w+\b', content))
              title = fname.replace('.md', '')
              encoded = fname.replace(' ', '%20')
              lines.append(f'| [{title}]({encoded}) | ~{words:,} | [Read]({encoded}) |')

          with open(os.path.join(papers_dir, 'index.md'), 'w', encoding='utf-8') as f:
              f.write('\n'.join(lines))
          
          print(f'Catalog regenerated: {len(papers)} papers indexed')
        shell: python
      
      - name: Commit updated catalog
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add releases/papers/index.md
          if git diff --cached --quiet; then
            echo 'No catalog changes'
          else
            git commit -m 'auto: Regenerate publication catalog [skip ci]'
            # a bare push loses the race to build-pdfs.yml (COMMITBACK-PUSH-RACE-1 in that file): rebase onto the new tip and retry, bounded
            for i in 1 2 3 4 5; do
              git pull --rebase --autostash origin master >/dev/null 2>&1 || true
              if git push origin HEAD:master; then
                echo "pushed on attempt $i"
                exit 0
              fi
              echo "push attempt $i rejected by a concurrent writer; retrying"
              sleep $((i * 5))
            done
            echo "PUSH FAILED after 5 attempts"
            exit 1
          fi
