name: Build PDF

on:
  workflow_dispatch:
    inputs:
      paper_path:
        description: "Path to markdown file"
        required: true
        type: string
      title:
        description: "PDF title"
        required: false
        type: string

env:
  PANDOC_IMAGE: pandoc/latex:latest

# GHA-AUDIT-DOTGITHUB-1 (2026-10-19, QNFO/qnfo-workers agent_issues 2507): dispatch inputs reach bash through env: and are quoted; Node 24
# action majors; read-only token (the job only uploads an artifact).
permissions:
  contents: read

# WORKFLOW-CONCURRENCY-1 (2026-10-17): a second run of the same workflow on the same
# branch queues behind the first instead of racing it. Publishing pipelines must never be
# cancelled mid-flight (a half-published DOI is worse than a late one), so this queues.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate input
        env:
          IN_PAPER_PATH: ${{ github.event.inputs.paper_path }}
        run: |
          FILE="$IN_PAPER_PATH"
          if [ ! -f "$FILE" ]; then
            echo "ERROR: File not found: $FILE"
            exit 1
          fi
          if [ ! -s "$FILE" ]; then
            echo "ERROR: File is empty: $FILE"
            exit 1
          fi
          echo "File validated: $FILE ($(wc -c < "$FILE") bytes)"

      - name: Build PDF
        env:
          IN_PAPER_PATH: ${{ github.event.inputs.paper_path }}
          IN_TITLE: ${{ github.event.inputs.title }}
        run: |
          PAPER="$IN_PAPER_PATH"
          TITLE="${IN_TITLE:-$IN_PAPER_PATH}"

          # Run pandoc with retry on docker pull failures
          for i in 1 2 3; do
            echo "Attempt $i/3..."
            if docker run --rm -v "${PWD}:/data" -w /data $PANDOC_IMAGE \
              "$PAPER" \
              --from=markdown+yaml_metadata_block+tex_math_dollars \
              --to=pdf \
              --pdf-engine=xelatex \
              --metadata=colorlinks:true \
              --metadata=linkcolor:blue \
              --metadata=title:"$TITLE" \
              --output=publication.pdf 2>&1; then
              echo "PDF built successfully"
              break
            else
              if [ $i -eq 3 ]; then
                echo "FATAL: PDF build failed after 3 attempts"
                exit 1
              fi
              echo "Attempt $i failed, retrying in 10s..."
              sleep 10
            fi
          done

      - name: Verify PDF
        run: |
          if [ ! -f publication.pdf ]; then
            echo "ERROR: PDF not generated"
            exit 1
          fi
          SIZE=$(stat -c%s publication.pdf 2>/dev/null || stat -f%z publication.pdf 2>/dev/null || echo 0)
          if [ "$SIZE" -lt 1000 ]; then
            echo "ERROR: PDF too small ($SIZE bytes) — likely corrupted"
            exit 1
          fi
          echo "PDF verified: $SIZE bytes"

      - name: Upload PDF
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: publication-pdf
          path: publication.pdf