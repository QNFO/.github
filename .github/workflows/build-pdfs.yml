name: Build PDFs from Legacy Papers

on:
  push:
    paths:
      - 'releases/papers/**.md'
  workflow_dispatch:

jobs:
  build-pdfs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install markdown

      - name: Determine changed papers
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "files=$(ls releases/papers/*.md 2>/dev/null | grep -v index.md | jq -R -s -c 'split(\"\n\")[:-1]')" >> $GITHUB_OUTPUT
          else
            git diff --name-only ${{ github.event.before }} ${{ github.event.after }} -- 'releases/papers/**.md' | grep -v index.md > /tmp/changed.txt
            echo "files=$(cat /tmp/changed.txt | jq -R -s -c 'split(\"\n\")[:-1]')" >> $GITHUB_OUTPUT
          fi

      - name: Build PDFs
        run: |
          mkdir -p releases/papers/pdf
          echo '${{ steps.changed.outputs.files }}' | jq -r '.[]' | while read paper; do
            if [ -f "$paper" ]; then
              echo "Building PDF for: $paper"
              python scripts/build_pdf.py --input "$paper" --output "releases/papers/pdf/$(basename "$paper" .md).pdf" --style academic 2>&1 || echo "PDF build failed for $paper"
            fi
          done

      - name: Upload PDF artifacts
        uses: actions/upload-artifact@v4
        with:
          name: legacy-paper-pdfs
          path: releases/papers/pdf/*.pdf
          retention-days: 90

      - name: Commit PDFs to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add releases/papers/pdf/
          if git diff --cached --quiet; then
            echo "No PDF changes to commit"
          else
            git commit -m "auto: Build legacy paper PDFs [skip ci]"
            git push
          fi
