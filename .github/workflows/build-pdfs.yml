name: Build PDFs from Legacy Papers

on:
  push:
    paths:
      - 'releases/papers/**.md'
  workflow_dispatch:

jobs:
  build-pdfs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install markdown

      - name: Build PDFs for all papers
        run: |
          mkdir -p releases/papers/pdf
          find releases/papers -maxdepth 1 -name '*.md' ! -name 'index.md' -print0 | while IFS= read -r -d '' paper; do
            echo "Building PDF for: $paper"
            python scripts/build_pdf.py --input "$paper" --output "releases/papers/pdf/$(basename "$paper" .md).pdf" --style academic 2>&1 || echo "PDF build failed for $paper"
          done

      - name: Upload PDF artifacts
        uses: actions/upload-artifact@v4
        with:
          name: legacy-paper-pdfs
          path: releases/papers/pdf/*.pdf
          retention-days: 90

      - name: Commit PDFs to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add releases/papers/pdf/
          if git diff --cached --quiet; then
            echo "No PDF changes to commit"
          else
            git commit -m "auto: Build legacy paper PDFs [skip ci]"
            git push
          fi
