name: Build PDFs from Legacy Papers

on:
  push:
    paths:
      - 'releases/papers/**.md'
  workflow_dispatch:

# WORKFLOW-CONCURRENCY-1 (2026-10-17): a second run of the same workflow on the same
# branch queues behind the first instead of racing it. Publishing pipelines must never be
# cancelled mid-flight (a half-published DOI is worse than a late one), so this queues.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-pdfs:
    runs-on: ubuntu-latest
    # WORKFLOW-TIMEOUT-1 (2026-10-17): bound a hung runner.
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install markdown

      - name: Build PDFs for all papers
        run: |
          mkdir -p releases/papers/pdf
          find releases/papers -maxdepth 1 -name '*.md' ! -name 'index.md' -print0 | while IFS= read -r -d '' paper; do
            echo "Building PDF for: $paper"
            python scripts/build_pdf.py --input "$paper" --output "releases/papers/pdf/$(basename "$paper" .md).pdf" --style academic 2>&1 || echo "PDF build failed for $paper"
          done

      - name: Upload PDF artifacts
        uses: actions/upload-artifact@v4
        with:
          name: legacy-paper-pdfs
          path: releases/papers/pdf/*.pdf
          retention-days: 90

      - name: Commit PDFs to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add releases/papers/pdf/
          if git diff --cached --quiet; then
            echo "No PDF changes to commit"
            exit 0
          fi
          git commit -m "auto: Build legacy paper PDFs [skip ci]"
          # COMMITBACK-PUSH-RACE-1 (2026-10-17): a bare `git push` into a shared branch loses the race
          # whenever another writer lands first, and the whole run then fails AFTER doing the work.
          # Measured 15:01:49Z: "! [rejected] master -> master (fetch first)" with 77 rebuilt PDFs
          # staged, so every one of them was discarded and the run went red. Rebase onto the new tip
          # and retry, bounded -- the pattern qnfo-workers already uses for its commit-back steps.
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin master >/dev/null 2>&1 || true
            if git push origin HEAD:master; then
              echo "pushed on attempt $i"
              exit 0
            fi
            echo "push attempt $i rejected by a concurrent writer; retrying"
            sleep $((i * 5))
          done
          echo "PUSH FAILED after 5 attempts -- COMMITBACK-PUSH-RACE-1"
          exit 1
