name: Zenodo DOI Registration

on:
  workflow_call:
    inputs:
      title:
        required: true
        type: string
      author:
        required: true
        type: string
        default: "Quni-Gudzinas, Rowan Brad"
      file_path:
        required: true
        type: string
      abstract:
        required: false
        type: string
        default: ""
      keywords:
        required: false
        type: string
        default: "ultrametric,quantum-computing,QWAV"
      sandbox:
        required: false
        type: boolean
        default: false
      communities:
        required: false
        type: string
        default: ""
    secrets:
      ZENODO_TOKEN:
        required: true
    outputs:
      doi:
        value: ${{ jobs.publish.outputs.doi }}
      zenodo_id:
        value: ${{ jobs.publish.outputs.zenodo_id }}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      doi: ${{ steps.retry.outputs.doi }}
      zenodo_id: ${{ steps.retry.outputs.zenodo_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: QNFO/zenodo-automation
          path: zenodo-automation

      - uses: actions/checkout@v4
        with:
          path: source-repo

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Publish to Zenodo (with retry)
        id: retry
        env:
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
        run: |
          ARGS="--token $ZENODO_TOKEN"
          ARGS="$ARGS --title \"${{ inputs.title }}\""
          ARGS="$ARGS --author \"${{ inputs.author }}\""
          ARGS="$ARGS --file \"source-repo/${{ inputs.file_path }}\""
          [ -n "${{ inputs.abstract }}" ] && ARGS="$ARGS --abstract \"${{ inputs.abstract }}\""
          [ -n "${{ inputs.keywords }}" ] && ARGS="$ARGS --keywords \"${{ inputs.keywords }}\""
          [ -n "${{ inputs.communities }}" ] && ARGS="$ARGS --communities \"${{ inputs.communities }}\""
          [ "${{ inputs.sandbox }}" = "true" ] && ARGS="$ARGS --sandbox"

          for i in 1 2 3; do
            echo "=== Attempt $i/3 ==="
            OUTPUT=$(python zenodo-automation/zenodo_publish.py $ARGS 2>&1)
            echo "$OUTPUT" | tee zenodo_output.txt

            if echo "$OUTPUT" | grep -qi "published\|DOI:"; then
              DOI=$(echo "$OUTPUT" | grep -oP 'doi\.org/\K10\.\d{4,9}/zenodo\.\d+' || echo "")
              [ -z "$DOI" ] && DOI=$(echo "$OUTPUT" | grep -oP 'DOI:?\s*\K10\.\d{4,9}/zenodo\.\d+' || echo "")
              echo "doi=$DOI" >> $GITHUB_OUTPUT
              ZID=$(echo "$DOI" | grep -oP '\d+$' || echo "")
              echo "zenodo_id=$ZID" >> $GITHUB_OUTPUT
              echo "SUCCESS: DOI=$DOI"
              exit 0
            fi

            if [ $i -eq 3 ]; then
              echo "FATAL: Zenodo publish failed after 3 attempts"
              echo "::error::Zenodo publication failed — check token scopes and file path"
              exit 1
            fi
            echo "Attempt $i failed, retrying in 15s..."
            sleep 15
          done